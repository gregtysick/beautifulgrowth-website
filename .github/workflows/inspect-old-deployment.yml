name: Inspect old site deployment
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List old nested directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os
          ftp = ftplib.FTP_TLS(os.environ['FTP_SERVER'], timeout=30)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          def show(path):
              for name, facts in ftp.mlsd(path):
                  if name in ('.', '..'):
                      continue
                  item = path + '/' + name
                  print(f"{facts.get('type')} {item}")
                  if facts.get('type') == 'dir':
                      show(item)
          show('public_html')
          ftp.quit()
          PY
